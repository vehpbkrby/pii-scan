services:
  scanner:
    build:
      context: .
      args:
        WITH_NLP: ${WITH_NLP:-1}
    image: pii-scan:${TAG:-full}
    env_file:
      - .env
    volumes:
      - ./config:/config:ro     # конфиг только на чтение
      - ./out:/out              # единственная точка записи
    # Если БД слушает на 127.0.0.1 того же сервера — из контейнера этот адрес
    # указывает на сам контейнер. Тогда либо сеть хоста:
    # network_mode: host
    #
    # либо доступ к хосту по имени:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    #
    # Если внутренняя DNS из контейнера не видна, адреса можно прописать там же:
    #   - "mysql-prod.corp.local:10.0.0.10"
    #
    # Изоляция: наружу утилита не ходит, при желании можно отрезать
    # доступ в интернет отдельной сетью с internal: true.
