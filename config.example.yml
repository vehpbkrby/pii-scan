# Пример конфигурации pii-scan.
# Скопируйте в config/config.yml и отредактируйте.
# Пароли сюда не пишутся: ${VAR} подставляется из окружения (файл .env).

scan:
  sample_limit: 500           # строк выборки на таблицу
  # head — начало таблицы, tail — конец, head_tail — пополам.
  # ПДн часто появляются в свежих записях, поэтому по умолчанию половина
  # выборки читается с конца по первичному ключу.
  sample_strategy: head_tail
  max_value_len: 512          # обрезка значения на стороне БД
  query_timeout: 15           # секунд на запрос (жёсткий лимит на сервере)
  max_columns_per_query: 60   # колонок в одной выборке
  max_threads: 2              # ограничение нагрузки (ClickHouse)
  scan_json: true             # разбирать JSON внутри значений
  max_json_paths: 200         # виртуальных колонок на одну JSON-колонку
  max_bytes_per_table: 2000000  # потолок трафика на таблицу (широкие читаются мельче)
  group_similar_tables: true    # шардированные и партиционированные — по образцу
  group_min_size: 4             # с какого размера группы включается
  group_samples: 2              # сколько представителей обследовать
  ner: true                   # NER по свободному русскому тексту
  ner_values_per_column: 50   # бюджет NER на колонку
  # Какие категории ПДн искать. Пусто = все.
  # Группы: names, contacts, documents, finance, birth и другие —
  # полный перечень выдаёт  pii-scan --list-detectors
  # Можно указывать и отдельные правила, например [snils, bank_card].
  detectors: []
  full_inventory: false       # true — в отчёты все поля, включая чистые
  # Замаскированные примеры значений в отчётах. 0 = не показывать:
  # даже маска оставляет длину и формат, а отчёт уходит наружу.
  examples_per_hit: 0         # ключ --examples [N] включает разово
  # Упрощённый отчёт: только находки, подтверждённые содержимым. Поля, чей
  # вывод держится на одном названии, исключаются, а их число объявляется —
  # молча урезанный отчёт неотличим от чистой базы.
  confirmed_only: false
  # Вклад совпадения по имени колонки. Понижать осторожно: снимает
  # уверенность и с подтверждённых находок, а правила, где имя решает само
  # (здоровье, родственники), ему вообще не подчиняются.
  name_boost: 0.35
  allow_rw: false             # true — разрешить учётку с правами на запись
  show_values: false          # true — НЕ маскировать значения (осторожно!)

# Ограничение нагрузки. По умолчанию не ограничивает ничего.
throttle:
  pause_ms: 0                 # пауза между запросами к БД
  max_queries_per_minute: 0   # 0 = без ограничения
  max_duration_min: 0         # бюджет времени, 0 = без ограничения

sources:
  - name: prod-mysql
    type: mysql
    host: 10.0.0.10
    port: 3306
    user: pii_reader
    password: ${MYSQL_PWD}
    secure: false                 # true — соединяться по TLS
    # ssl_ca: /config/ca.pem      # корневой сертификат (путь внутри контейнера)
    # ssl_verify: true            # false — не проверять сертификат сервера
    databases: []                 # пусто = все, кроме системных
    exclude_databases: []
    include_tables: []            # regex; пусто = все
    exclude_tables:
      - '_archive$'
      - '^tmp_'
    skip_views: true
    # settings:                 # переменные сессии MySQL
    #   max_execution_time: 5000

  - name: prod-postgres
    type: postgres
    host: 10.0.0.15
    port: 5432
    user: pii_reader
    password: ${PG_PWD}
    secure: false               # true — sslmode=verify-full
    # Пусто = все базы, к которым разрешено подключаться. В PostgreSQL нет
    # межбазовых запросов, поэтому на каждую базу открывается своё соединение.
    databases: []
    # settings:                 # параметры сессии PostgreSQL
    #   work_mem: '32MB'

  - name: prod-clickhouse
    type: clickhouse
    host: 10.0.0.20
    port: 8123                    # HTTP; для clickhouse-driver будет 9000
    user: pii_reader
    password: ${CH_PWD}
    secure: false                 # true — HTTPS (порт обычно 8443)
    # ssl_ca: /config/ca.pem
    # ssl_verify: true
    databases: []
    exclude_tables:
      - '^\.inner'
    # Distributed и Merge пропускаются по умолчанию: иначе те же данные
    # попадут в отчёт по нескольку раз. Чтобы сканировать их — задайте
    # пустой список.
    skip_engines: [Distributed, Merge, Null, View, MaterializedView]
    # settings:                 # родные ограничители ClickHouse
    #   max_bytes_to_read: 100000000
    #   max_execution_speed_bytes: 20000000
    #   priority: 10
